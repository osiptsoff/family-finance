server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: crud
            uri: lb://crud
            predicates:
            - Path=/{platform:(mobile|webapp)}/api/{entity:(target|transaction)}/**
            filters:
            # возможно, в будущем будет разделение на логику для mobile и web
            - StripPrefix=1
            - SaveSession
            - TokenRelay=keycloak
  security:
    oauth2:
      client:
        provider:
          finance-app:
            issuer-uri: http://localhost:8080/realms/finance-app
        registration:
          keycloak:
            provider: finance-app
            client-id: finance-webapp
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: PKCE
            scope:
            - openid
            - profile
            - email
            - offline_access
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  session:
    store-type: redis

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      