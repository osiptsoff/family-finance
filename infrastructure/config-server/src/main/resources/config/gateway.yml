server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: web
            uri: lb://web-bff
            predicates:
            - Path=/webapp/**
            filters:
            - StripPrefix=1
          - id: mobile
            uri: lb://mobile-bff
            predicates:
            - Path=/mobile/**
            filters:
            - StripPrefix=1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      