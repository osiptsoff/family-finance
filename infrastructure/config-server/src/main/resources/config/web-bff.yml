server:
  port: 0

spring:
  security:
    oauth2:
      client:
        provider:
          finance-app:
            issuer-uri: http://localhost:8080/realms/finance-app
        registration:
          keycloak:
            provider: finance-app
            client-id: finance-webapp
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: PKCE
            scope:
            - openid
            
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/